name: Void Drop Sync

on:
  schedule:
    # Runs every 5 minutes on GitHub Actions runner
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync-drop:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Next Drop from Worker
        env:
          WORKER_URL: ${{ secrets.VOID_WORKER_URL }}
          ADMIN_SECRET: ${{ secrets.VOID_ADMIN_SECRET }}
        run: |
          mkdir -p web/public/data
          
          # If worker URL and secret are configured, request drop from worker
          if [ -n "$WORKER_URL" ]; then
            echo "Requesting drop from Void Worker..."
            curl -s -X POST "$WORKER_URL/api/vault/dispense" \
              -H "Authorization: Bearer $ADMIN_SECRET" \
              -H "Content-Type: application/json" \
              -o web/public/data/current.json
          fi

      - name: Commit & Push Updated Drop to GitHub Pages
        run: |
          git config --global user.name "Void Automator"
          git config --global user.email "bot@thevoid.internal"
          git add web/public/data/current.json || true
          if git diff --staged --quiet; then
            echo "No change in current drop."
          else
            git commit -m "Auto-sync: update current void drop [skip ci]"
            git push
          fi
